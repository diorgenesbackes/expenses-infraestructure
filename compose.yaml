name: expenses-local

services:
  backend:
    image: expenses-backend:local
    build:
      context: ./expenses-service
    container_name: expenses-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Expenses: 'Host=postgres;Port=5432;Database=${POSTGRES_DB:-expenses};Username=${POSTGRES_USER:-admin};Password="${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}";Timeout=5'
    ports:
      - "127.0.0.1:5183:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: expenses-frontend:local
    build:
      context: ./expenses-ui
    container_name: expenses-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: expenses-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expenses}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
